# Compila il sito con Eleventy e lo pubblica su GitHub Pages
name: Deploy static content to Pages

on:
  # Ad ogni push sul ramo predefinito
  push:
    branches: ["main"]
    # I rapporti di traffico non finiscono nel sito: non c'è nulla da
    # ricostruire quando cambiano soltanto quelli.
    paths-ignore:
      - 'analisi/**'

  # Avviabile anche a mano dalla scheda Actions
  workflow_dispatch:

# Permessi necessari al GITHUB_TOKEN per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione per volta: le richieste in coda vengono
# saltate, ma quella in corso non viene mai interrotta.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Le fotografie possono stare in una repository privata invece che
      # in questa. Questo passo le preleva da lì e le posa in `foto/`
      # prima di compilare; se le due impostazioni non ci sono, non fa
      # nulla e valgono le foto presenti nel repository.
      #
      # Serve:
      #   · una variabile  FOTO_REPO    p.es. nzetaq/fotografie
      #   · un segreto     FOTO_CHIAVE  un token a grana fine con
      #                                 «Contents: Read» su quella sola
      #
      # Vale la pena ricordare che le foto pubblicate sono pubbliche
      # comunque: la repository privata protegge gli originali — quelli
      # grandi, quelli scartati, quelli col luogo dentro — non le copie
      # che finiscono in linea.
      - name: Preleva le fotografie dalla repository privata
        if: ${{ vars.FOTO_REPO != '' }}
        env:
          CHIAVE: ${{ secrets.FOTO_CHIAVE }}
          REPO: ${{ vars.FOTO_REPO }}
        run: |
          if [ -z "$CHIAVE" ]; then
            echo "::warning::FOTO_REPO è impostata ma FOTO_CHIAVE manca: uso le foto già nel repository."
            exit 0
          fi
          # In una cartella a parte, e non direttamente in foto/: così
          # un prelievo a metà non lascia il sito con mezze fotografie.
          git clone --depth 1 --quiet \
            "https://x-access-token:$CHIAVE@github.com/$REPO.git" /tmp/fotografie
          mkdir -p foto
          # Si copiano le immagini e le didascalie, non la cronologia
          # né altro che stia in quella repository.
          find /tmp/fotografie -maxdepth 2 -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
            -exec cp {} foto/ \;
          [ -f /tmp/fotografie/didascalie.json ] && cp /tmp/fotografie/didascalie.json foto/
          echo "Prelevate $(ls -1 foto/ | grep -icE '\.(jpg|jpeg|png|webp)$') fotografie da $REPO."

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Solo il sito compilato, non l'intero repository
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
