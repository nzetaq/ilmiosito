# Compila il sito con Eleventy e lo pubblica su GitHub Pages
name: Deploy static content to Pages

on:
  # Ad ogni push sul ramo predefinito
  push:
    branches: ["main"]
    # I rapporti di traffico non finiscono nel sito: non c'è nulla da
    # ricostruire quando cambiano soltanto quelli.
    paths-ignore:
      - 'analisi/**'

  # Avviabile anche a mano dalla scheda Actions
  workflow_dispatch:

# Permessi necessari al GITHUB_TOKEN per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione per volta: le richieste in coda vengono
# saltate, ma quella in corso non viene mai interrotta.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Solo il sito compilato, non l'intero repository
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
