# Compila il sito con Eleventy e lo pubblica su GitHub Pages
name: Deploy static content to Pages

on:
  # Ad ogni push sul ramo predefinito
  push:
    branches: ["main"]

  # Avviabile anche a mano dalla scheda Actions
  workflow_dispatch:

# Permessi necessari al GITHUB_TOKEN per pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione per volta: le richieste in coda vengono
# saltate, ma quella in corso non viene mai interrotta.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo il sito compilato, non l'intero repository
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
