<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
  <!-- Variante a doppia risoluzione. Stesso disegno, dimensione
       propria doppia: Safari rasterizza il cursore una volta sola, e
       senza questa lo mostrerebbe sfocato sugli schermi fitti. -->
  <!-- La freccia del sito: corpo arancio, anello di carta, orlo
       d'inchiostro. I tre strati servono a un solo scopo — che si
       veda tanto sul fondo blu quanto su quello chiaro, senza dover
       cambiare file al cambio di tema. La punta sta in (2,2), che è
       il punto caldo dichiarato nel foglio di stile. -->
  <g transform="translate(2 2)">
    <path d="M0 0 L0 15.4 L4.1 11.7 L6.6 17 L9.3 15.7 L6.8 10.6 L12 10.6 Z"
          fill="#ff5a36" stroke="#151d33" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M0 0 L0 15.4 L4.1 11.7 L6.6 17 L9.3 15.7 L6.8 10.6 L12 10.6 Z"
          fill="#ff5a36" stroke="#f4f0e6" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
